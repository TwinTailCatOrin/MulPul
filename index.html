<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4a3528">
<title>우리 물풀 정원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#c3cfc6; --ink:#26302b; --night-ink:#e7e3f3;
  --tray:#4a3528; --tray-hi:#6b4d38; --tray-lo:#33251c;
  --btn:#5a4233; --btn-sel:#6d5140; --tray-ink:#f1e7d6; --tray-dim:#c3ae92; --accent:#a6cf58; --warn:#e98b6b;
  --card:#f4efe3; --card-ink:#2b2a22; --card-line:#d9d0bd; --cube:rgba(255,255,255,.35); --cube-ink:#26302b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --tray:#3f2d22; --tray-hi:#5a4130; --tray-lo:#2a1e17; --btn:#4b372b; --btn-sel:#5e4637; --card:#e9e2d2; }
}
:root[data-theme="dark"]{ --tray:#3f2d22; --tray-hi:#5a4130; --tray-lo:#2a1e17; --btn:#4b372b; --btn-sel:#5e4637; --card:#e9e2d2; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--wall);overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--wall);color:var(--ink);
  font-family:'Do Hyeon',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#top{flex:none;display:flex;align-items:flex-start;gap:10px;padding:10px 12px 4px;color:var(--ink);transition:color .8s}
body.night #top, body.night #restore, body.night #fitBtn{color:var(--night-ink)}
body.night{--cube:rgba(255,255,255,.14);--cube-ink:var(--night-ink)}
#info{flex:1;min-width:0}
#clock{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:14px;opacity:.78;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;color:inherit;background:transparent;border:2px solid currentColor;padding:4px 10px;cursor:pointer;opacity:.85;white-space:nowrap;min-height:32px}
.chip:active{opacity:1}
#cube{flex:none;display:grid;grid-template-columns:repeat(3,28px);grid-template-rows:repeat(3,28px);gap:3px}
#cube button{font:inherit;font-size:13px;color:var(--cube-ink);background:var(--cube);border:0;padding:0;cursor:pointer;line-height:1}
#cube button[aria-pressed="true"]{background:var(--accent);color:#1f2a14}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#cv{position:absolute;left:0;top:0;transform-origin:0 0;display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}
#restore{position:absolute;right:10px;top:10px;z-index:4;display:none;color:var(--ink);opacity:.35}
#fitBtn{position:absolute;right:10px;bottom:10px;z-index:4;color:var(--ink);background:var(--cube)}
#fitBtn[hidden]{display:none}
body.widget #top, body.widget #tray, body.widget #fitBtn{display:none}
body.widget #restore{display:block}
#tray{flex:none;background:var(--tray);color:var(--tray-ink);border-top:4px solid var(--tray-hi);box-shadow:inset 0 -4px 0 var(--tray-lo)}
#tabs{display:flex;align-items:stretch;padding:2px 4px 0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-size:16px;color:var(--tray-dim);background:transparent;border:0;padding:10px 11px 10px;cursor:pointer;position:relative}
.tab[aria-selected="true"]{color:var(--tray-ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:11px;right:11px;bottom:4px;height:3px;background:var(--accent)}
#brushBtn{margin-left:auto;display:flex;align-items:center;gap:8px}
#brushDot{display:inline-block;background:currentColor}
#items{display:flex;gap:6px;padding:4px 8px 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#items::-webkit-scrollbar{display:none}
.item{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:12.5px;color:var(--tray-ink);
  background:var(--btn);border:0;padding:7px 2px 7px;cursor:pointer;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.07)}
.item span{white-space:nowrap}
.item[aria-pressed="true"]{background:var(--btn-sel);box-shadow:inset 0 0 0 2px var(--accent)}
.item.armed{box-shadow:inset 0 0 0 2px var(--warn)}
.item canvas{width:44px;height:44px;image-rendering:crisp-edges;image-rendering:pixelated}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#card{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;background:var(--card);color:var(--card-ink);padding:10px 12px 11px;
  box-shadow:4px 4px 0 rgba(0,0,0,.25);font-size:15px;line-height:1.5;cursor:pointer;max-width:340px}
#card b{display:block;font-weight:normal;font-size:19px;margin-bottom:1px}
#card small{font-size:13px;opacity:.7;margin-left:6px}
#card[hidden]{display:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;background:var(--card);color:var(--card-ink);padding:7px 13px;font-size:14px;
  box-shadow:3px 3px 0 rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(20,24,22,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#panel{width:100%;max-width:560px;max-height:86%;overflow-y:auto;background:var(--card);color:var(--card-ink);
  padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 0 rgba(0,0,0,.2);-webkit-overflow-scrolling:touch}
#panel h2{font-weight:normal;font-size:22px;margin:0}
#panel h3{font-weight:normal;font-size:17px;margin:18px 0 8px;padding-top:12px;border-top:2px solid var(--card-line)}
#panel .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#panel .between{justify-content:space-between}
#panel .pbtn{font:inherit;font-size:15px;color:var(--card-ink);background:transparent;border:2px solid var(--card-ink);padding:6px 12px;cursor:pointer;min-height:36px}
#panel .pbtn.main{background:var(--card-ink);color:var(--card)}
#panel .pbtn.armed{border-color:var(--warn);color:#b0462a}
#panel .pbtn:disabled{opacity:.35;cursor:default}
#panel .small{font-size:13px;opacity:.7}
#nameIn{font:inherit;font-size:17px;color:var(--card-ink);background:transparent;border:0;border-bottom:2px solid var(--card-line);padding:4px 0;flex:1;min-width:0}
.dim{display:grid;grid-template-columns:44px 1fr 60px;align-items:center;gap:8px;margin:6px 0}
.dim input{width:100%;accent-color:#5b7a2e}
.dim output{text-align:right;font-size:15px}
.tank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--card-line)}
.tank .nm{flex:1;min-width:0}
.tank .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header id="top">
  <div id="info">
    <div id="clock">--</div>
    <div id="sub"></div>
    <div id="chips">
      <button class="chip" id="tankBtn" title="수조와 정원 보관함">보관함</button>
      <button class="chip" id="speedBtn" title="시간 속도">×1</button>
      <button class="chip" id="seasonBtn" title="계절">사계절</button>
      <button class="chip" id="widgetBtn" title="도구를 숨기고 수조만 보기">위젯</button>
    </div>
  </div>
  <div id="cube" role="group" aria-label="보는 방향"></div>
</header>
<main id="stage">
  <canvas id="cv" aria-label="수조"></canvas>
  <button class="chip" id="restore">도구 열기</button>
  <button class="chip" id="fitBtn" hidden>화면에 맞추기</button>
  <div id="card" hidden></div>
  <div id="toast" role="status"></div>
</main>
<nav id="tray">
  <div id="tabs" role="tablist"></div>
  <div id="items"></div>
</nav>
<div id="sheet" hidden><div id="panel" role="dialog" aria-label="수조 관리"></div></div>
<script>
(()=>{
'use strict';
// ================= world =================
let X=56,Y=44,Z=36,LAYER=X*Z,N=X*Y*Z;
const MAXX=240,MAXZ=240,MAXY=80,MINS=20;
const E=0,SOIL=1,SAND=2,GRAV=3,ROCK=4,WOOD=5,GRASS=6,STONE=7,PLANK=8,PATH=9,LIGHT=10;
const GRAN=[0,1,1,1,0,0,1,0,0,0,0], SLIP=[0,.3,.85,.65,0,0,.25,0,0,0,0];
const MATNAME=['','진흙','모래','자갈','바위','유목','잔디','돌','나무 울타리','디딤돌','석등 불빛'];
let nutr=0, glass=true, lights=[], parts=[], overWarned=false;
const idx=(x,y,z)=>y*LAYER+z*X+x;
const inB=(x,y,z)=>x>=0&&y>=0&&z>=0&&x<X&&y<Y&&z<Z;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
let grid,pcol,pown,stampA,hm,ptop,acolCol;
const acol=new Map(), aown=new Map();
let pList=[], aList=[], aCols=[], plants=[], animals=[], wl=20, terrainVer=0;
const FLAG=0x1000000;
function hash(x,y){ let n=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0; n=Math.imul(n^(n>>>13),1274126177); n^=n>>>16; return (n>>>0)/4294967296; }
const vh=k=>hash(k,k*7+3);
function rng(seed){ let s=(seed>>>0)||0x9e3779b9; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
const WLi=()=>Math.max(0,Math.floor(wl));
const hAt=(x,z)=>hm[clamp(Math.round(z),0,Z-1)*X+clamp(Math.round(x),0,X-1)];
const rndSeed=()=>(Math.random()*2147483647)|0;
const capScale=()=>Math.max(1,(X*Z)/(56*36));
const plantCap=()=>Math.min(4000,Math.round(520*capScale()));
const animalCap=()=>Math.min(200,Math.round(40*Math.sqrt(capScale())));
function allocWorld(nx,ny,nz){ X=nx; Y=ny; Z=nz; LAYER=X*Z; N=LAYER*Y;
  grid=new Uint8Array(N); pcol=new Int32Array(N); pown=new Uint16Array(N); stampA=new Uint8Array(N);
  hm=new Uint8Array(LAYER); ptop=new Uint8Array(LAYER); acolCol=new Uint8Array(LAYER);
  pList=[]; aList=[]; aCols=[]; acol.clear(); aown.clear(); box=null; active=false; isoCacheVer=-1; plantsDirty=true; }
function recomputeHM(x0=0,x1=X-1,z0=0,z1=Z-1){ for(let z=z0;z<=z1;z++) for(let x=x0;x<=x1;x++){ let y=Y-1; while(y>=0&&!grid[idx(x,y,z)]) y--; hm[z*X+x]=y+1; } terrainVer++; }

// ================= colors =================
const P=h=>parseInt(h.slice(1),16);
const R_=c=>(c>>16)&255, G_=c=>(c>>8)&255, B_=c=>c&255;
function mixP(a,b,t){ return (Math.round(R_(a)+(R_(b)-R_(a))*t)<<16)|(Math.round(G_(a)+(G_(b)-G_(a))*t)<<8)|Math.round(B_(a)+(B_(b)-B_(a))*t); }
function mulP(c,f){ return (Math.min(255,R_(c)*f|0)<<16)|(Math.min(255,G_(c)*f|0)<<8)|Math.min(255,B_(c)*f|0); }
const C={};
Object.entries({
  soil:'#5a3f2c',soil2:'#6b4b34',soilTop:'#74563b',sand:'#c9ac75',sand2:'#d8bf8a',g1:'#8a8f94',g2:'#6b7075',g3:'#a9adb0',
  rock:'#6a7075',rockHi:'#858d92',rockLo:'#51565a',wood:'#6e4a2e',wood2:'#86603c',
  water:'#3a86a8',waterHi:'#9fdcea',wall:'#c3cfc6',back:'#b7c9c3',floor:'#39403c',glass:'#e4f4f1',sil:'#28302c',stand:'#6b4a32',standHi:'#8a6443',white:'#ffffff',
  lotusStem:'#6f8f4a',lotusL:'#5f9a5a',lotusC:'#9cc48a',lotusE:'#4a7f4c',petal:'#f4b3c6',petalTip:'#e0708f',pod:'#e8d56a',podTop:'#d9c04a',podSide:'#7f7a44',podTop2:'#5e5a30',
  brownLeaf:'#9c8a52',straw:'#b8a466',
  lily:'#4f8f45',lilyE:'#3e7a3a',lilyR:'#8a4a3e',lilyPet:'#6b4a3a',wFlower:'#f6f4ec',wFlower2:'#e6e8da',yellow:'#f0cf4a',budG:'#cfdcb0',
  nym:'#5a9a48',nymM:'#76643a',nymF:'#f2c521',nymF2:'#f8de6a',nymBud:'#b9a23c',
  trapa:'#4f8a38',trapaL:'#6fa84a',trapaRed:'#b04a2e',trapaStem:'#6a7a3a',trapaBulb:'#9bb862',fruit:'#2e2a24',
  mono:'#3f8f3a',monoL:'#6fb85a',monoPet:'#5b8a42',violet:'#6f73e0',violetL:'#a2a6f6',violetBud:'#5a6aa0',
  typha:'#6f9a4a',typhaL:'#86ad58',typhaStalk:'#7a9a50',spike:'#6b3f22',spikeG:'#5f6a3a',male:'#d8c080',fluff:'#d8cdb8',
  acorus:'#5f9a48',acorusTip:'#7fb45a',spadix:'#b8b04a',
  hydS:'#2e6b2e',hyd:'#3f8a3a',val:'#5aa04a',valL:'#7cc05a',valStalk:'#c8d8a0',cer:'#2f5f2c',cerL:'#4e8a3a',
  duck:'#5aa73a',duckL:'#79c24c',duckRoot:'#cfd8b0',salv:'#6f8f3a',salvL:'#a3b06a',salvS:'#5b6a32',salvRoot:'#8a6a4a',
  misc:'#6f9a4a',miscL:'#8fb45e',plumeR:'#c8988a',plumeS:'#e8e2d6',plumeW:'#d8cfbc',
  reedC:'#8aa860',reedLf:'#6f9a4a',reedP:'#7a5a5a',reedP2:'#c8b8a0',
  gomS:'#9a6a50',gomL:'#5f9a48',gomF:'#f0b0c4',gomF2:'#e27a9a',
  touchS:'#c07a78',touchL:'#5a9a48',touchF:'#b4468c',touchF2:'#d06ba8',
  irisL:'#5a9048',irisM:'#86b86a',irisF:'#6b3fa0',irisF2:'#8a5ac8',irisY:'#e8c040',irisBud:'#4a3a80',
  lyS:'#5f8a45',lyL:'#6f9a52',lyF:'#c2407e',lyF2:'#e06aa0',
  drL:'#5aa04a',drL2:'#7cc05a',umb:'#f4f2e6',
  viL:'#4f8a3c',viL2:'#6aa84a',viF:'#7a4fc0',viC:'#f0e0f0',
  daL:'#4f8f3a',daL2:'#6aa848',daF:'#f2c521',puff:'#f4f4ee',
  hoS:'#5aa03a',hoB:'#7cc05a',hoF:'#b8906a',hoC:'#8a6a4a',
  mo1:'#4f7f34',mo2:'#6a9a3f',moT:'#7aa84a',
  pine:'#2f5a3a',pineTop:'#4a7a4a',pineBark:'#a8603c',pineBarkL:'#6b4a38',
  mapleBark:'#6f6a60',twig:'#7a6a5a',maple:'#4f9a3f',mapleL:'#6fb85a',mapleSpring:'#9ad060',mapleSpringR:'#b8584a',mapleRed:'#c8322a',mapleOr:'#e07a2a',leafYel:'#e2b83a',
  zelBark:'#7a6a58',zel:'#4f8a3a',zelL:'#6aa04a',zelA1:'#c8783a',zelA2:'#b0602a',zelA3:'#d89a4a',
  willowStem:'#8a4a3a',willowL:'#8fae7a',willowL2:'#b8c8a0',catkin:'#ecece4',catkinY:'#e8d060',
  azStem:'#6a4a3a',azFl:'#d8458c',azFl2:'#f080b0',azLeaf:'#5a8a3a',azAut:'#c05030',
  spStem:'#8a6a50',spFl:'#f6f4ee',spLeaf:'#6a9a48',spAut:'#c87a3a',
  grass:'#5f9e3c',grassL:'#7cb84a',grassD:'#4a8432',stoneD:'#55524c',stone1:'#8f8b82',stone2:'#a29e94',stone3:'#b5b1a6',plank:'#8a6040',plank2:'#a07448',
  path:'#c9c3b2',path2:'#a9a396',lamp:'#ffe6a0',lampGlow:'#ffd27a',sky:'#bcd6e2',algae:'#5f8a2e',cfl:'#4a78f0',cflD:'#2f4cb8',cflC:'#3a2a7a',cflS:'#7a9a78',wdF:'#f4f2e8',
  frogB:'#6a9a3a',frogB2:'#5a8432',frogH:'#7aa84a',frogE:'#2a2a1a',frogL:'#4f7a2e',frogSac:'#e8e6c8',salH:'#5a4430',salB:'#7a5a3a',salB2:'#4a3424',salT:'#6a4a30',
  sqH:'#c08040',sqB:'#b8743a',sqS:'#4a3020',sqT:'#8a5a30',sqT2:'#c89060',burrow:'#3a2a1e',
  snow:'#f4f6f8',ice:'#d6eef5',rain:'#cfdbe6',skyGray:'#8f9aa2',wsB:'#b8722e',wsH:'#a8682a',wsM:'#3a2818',wsE:'#8a5020',wsT:'#9a5a24',
  bfW:'#f6f6ee',bfW2:'#dcdcd2',bfB:'#3a3a30',spark:'#f2e08a',
  wilt:'#b39a58',dead:'#7a6448',
  fishH:'#8e9477',fishB:'#d6d9c0',fishT:'#b3b69a',shrH:'#9b8a6a',shrB:'#c2ad85',snail:'#4a4a30',snailT:'#6b6a45',snailF:'#a89a78',
  strB:'#3a3326',strL:'#8a8578',ffBody:'#3a3322',ffOn:'#f4ff9a',ffOff:'#9a9a5a',ffGlow:'#c8ff78'
}).forEach(([k,v])=>C[k]=P(v));
const WATER0=P('#3a86a8');
const bgC=()=>glass?C.wall:mixP(C.sky,C.skyGray,WX_CLOUD[weather.type]||0);
function matRGB(m,k){ const n=vh(k);
  switch(m){
    case SOIL:{ const up=k+LAYER; const top=up>=N||!grid[up]; return top?(n>.5?C.soilTop:C.soil2):(n<.22?C.soil2:C.soil); }
    case SAND: return n>.6?C.sand2:C.sand;
    case GRAV: return n<.33?C.g1:(n<.66?C.g2:C.g3);
    case ROCK:{ const up=k+LAYER; return (up>=N||grid[up]!==ROCK)?C.rockHi:(n>.8?C.rockLo:C.rock); }
    case WOOD: return n>.55?C.wood2:C.wood;
    case GRASS:{ const up=k+LAYER; const top=up>=N||!grid[up]; return top?(n>.62?C.grassL:n>.25?C.grass:C.grassD):(n<.22?C.soil2:C.soil); }
    case STONE: return n<.12?C.stoneD:n<.45?C.stone1:n<.8?C.stone2:C.stone3;
    case PLANK: return n>.5?C.plank:C.plank2;
    case PATH:{ const up=k+LAYER; return (up>=N||!grid[up])?(n>.5?C.path:C.path2):C.path2; }
    case LIGHT: return C.lamp;
  } return C.white; }

// ================= time =================
let speed=1, simTime=Date.now(), summer=false;
const SPEEDS=[1,60,600,3600];
const simDate=()=>new Date(simTime);
function curMonth(){ return summer?7:simDate().getMonth()+1; }
function curHour(){ const d=simDate(); return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600; }
function dayOfYear(d){ return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000); }
function sunTimes(d){ const doy=summer?196:dayOfYear(d); const hd=6.08+1.33*Math.cos(2*Math.PI*(doy-172)/365); return [12.55-hd,12.55+hd]; }
function lightAtDate(d){ const h=d.getHours()+d.getMinutes()/60; const [sr,ss]=sunTimes(d);
  if(h<sr-0.5||h>ss+0.5) return 0; if(h<sr+0.7) return (h-(sr-0.5))/1.2; if(h>ss-0.7) return ((ss+0.5)-h)/1.2; return 1; }
function tintFor(L){ const night=[.30,.33,.52]; const t=[night[0]+(1-night[0])*L,night[1]+(1-night[1])*L,night[2]+(1-night[2])*L];

    if(o+2>out.length){ const nb=new Uint8Array(out.length*2); nb.set(out); out=nb; } out[o++]=v; out[o++]=n; i+=n; }

let lastEnc=null, dbApi=null, uidP='';
const CHUNK=180000;
async function cloudSave(){ if(!dbApi||!lastEnc||!cloudDirty) return; const t=cur(); if(!t) return; cloudDirty=false;
  try{ const str=lastEnc.data, n=Math.max(1,Math.ceil(str.length/CHUNK));
    for(let i=0;i<n;i++) await dbApi.doc(`${uidP}aq-${t.id}-${i}`).set({d:str.slice(i*CHUNK,(i+1)*CHUNK),n,savedAt:lastEnc.savedAt});
    for(let i=n;i<(t.chunks||0);i++) await dbApi.doc(`${uidP}aq-${t.id}-${i}`).delete();

  lastCloud=Date.now(); }

  const f=first.data(); s=f.d; for(let i=1;i<f.n;i++){ const q=await dbApi.doc(`${uidP}aq-${t.id}-${i}`).get(); if(!q.exists) return null; s+=q.data().d; }
  return {savedAt:f.savedAt,data:s}; }catch(e){ return null; } }

function iconCanvas(id){ const S=24, c=document.createElement('canvas'); c.width=S; c.height=S; const x2=c.getContext('2d'), im=x2.createImageData(S,S), d=im.data;
  const put=(x,y,col)=>{ x=Math.round(x); y=Math.round(y); if(x<0||y<0||x>=S||y>=S) return; const i=(y*S+x)*4; d[i]=R_(col); d[i+1]=G_(col); d[i+2]=B_(col); d[i+3]=255; };
  const map=M=>{ M.m.forEach((row,y)=>{ for(let x=0;x<row.length;x++){ const ch=row[x]; if(ch==='.') continue; const col=P(M.c[ch]); put(2*x,2*y,col); put(2*x+1,2*y,col); put(2*x,2*y+1,col); put(2*x+1,2*y+1,col); } }); };
  if(MAPS[id]) map(MAPS[id]);
  else if(id in MATID){ const m=MATID[id]; for(let x=1;x<=10;x++){ const top=6+Math.round(Math.pow((x-5.5)/4.5,2)*3); for(let y=top;y<=10;y++){ const n=hash(x*131+m,y*17);
      const col=m===GRASS?(y<=top+1?(n>.5?C.grassL:C.grass):(n<.25?C.soil2:C.soil)):m===SOIL?(y===top?C.soilTop:(n<.25?C.soil2:C.soil)):m===SAND?(n>.6?C.sand2:C.sand):(n<.33?C.g1:n<.66?C.g2:C.g3);
      put(2*x,2*y,col); put(2*x+1,2*y,col); put(2*x,2*y+1,col); put(2*x+1,2*y+1,col); } } }
  else if(SP[id]){ const cf=ICON_CFG[id], sp=SP[id], yb=cf.yb??2, WL=cf.wl, vox=[], zf=cf.zf||1;
    const mo=cf.mo??(sp.bloom?sp.bloom[0]:7), hr=sp.open?(sp.open[0]+sp.open[1])/2:12, ibloom=!!(sp.bloom&&mo>=sp.bloom[0]&&mo<=sp.bloom[1]);
    const one=(fx,fz,seed)=>BUILD[id]({x:Math.round(fx),z:Math.round(fz),fx,fz,yb,WL,g:cf.g,mo,hr,tt:0,mature:true,bloom:ibloom,open:true,seed,autumn:autumnT(mo),p:{y:WL-8,t:id},sh:()=>yb,
      emit:(x,y,z,col)=>vox.push([Math.round(x),Math.round(y),Math.round(z),col])});
    if(id==='duck'){ [[10,12],[12,11],[13,13],[14,12],[11,13],[12,14],[14,10]].forEach(([x,z],i)=>one(x,z,i)); }
    else if(id==='salv'){ one(11,11,2); one(13,14,3); }
    else one(12,12,id==='lotus'?5:id==='typha'?9:id==='acorus'?3:7);
    const oy=cf.oy??0, prj=(x,y,z)=>[12+((x-12)+(z-12)*0.5)*zf,23-oy-((y-yb)+(z-12)*0.5)*zf-yb*zf];
    const slabY=WL>yb?WL-1:yb-1, slabC=WL>yb?mixP(C.water,C.white,0.25):C.soilTop;
    for(let z=4;z<=20;z++) for(let x=2;x<=22;x++){ const [px,py]=prj(x,slabY,z); for(let a=0;a<zf;a++) for(let b=0;b<zf;b++) put(px+a,py+b,slabC); }
    vox.sort((a,b)=>(b[2]-a[2])||(a[1]-b[1]));
    for(const [x,y,z,col] of vox){ const [px,py]=prj(x,y,z); const cc=y<WL-1?mixP(col,C.water,0.3):col; for(let a=0;a<zf;a++) for(let b=0;b<zf;b++) put(px+a,py+b,cc); } }
  x2.putImageData(im,0,0); return c; }

const PRESETS=[['60cm 기본',56,44,36],['작은 정원',96,40,72],['90cm',86,46,46],['120cm',116,50,50],['작은 연못',160,50,120],['최대',240,80,240]];

function load(n){ return n<1.5e6?'가벼움':n<3e6?'보통':'무거움, 오래된 폰은 느릴 수 있어요'; }
function el(tag,attrs,...kids){ const e=document.createElement(tag); for(const k in attrs||{}){ if(k==='on') for(const ev in attrs.on) e.addEventListener(ev,attrs.on[ev]); else if(k==='text') e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); } kids.forEach(k=>k&&e.appendChild(k)); return e; }
function armSheet(key,msg,fn){ if(sheetArm!==key){ sheetArm=key; toast(msg); clearTimeout(sheetArmTimer); sheetArmTimer=setTimeout(()=>{ sheetArm=null; renderSheet(); },3000); renderSheet(); return; }
  sheetArm=null; clearTimeout(sheetArmTimer); fn(); }
function fmtDate(t){ if(!t) return ''; const d=new Date(t); return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function renderSheet(){ if(!draft) draft={X,Y,Z}; panel.innerHTML=''; const t=cur();
  panel.appendChild(el('div',{class:'row between'},el('h2',{text:glass?'수조':'정원'}),el('button',{class:'pbtn',text:'닫기',on:{click:closeSheet}})));
  const nameIn=el('input',{id:'nameIn',value:t?t.name:'',maxlength:'24','aria-label':'수조 이름'});
  nameIn.addEventListener('change',()=>{ const v=nameIn.value.trim(); if(t&&v){ t.name=v; t.updatedAt=Date.now(); saveIndexLocal(); cloudSaveIndex(); label(); } });
  panel.appendChild(el('div',{class:'row',style:'margin-top:10px'},nameIn));
  panel.appendChild(el('div',{class:'small',style:'margin-top:6px',text:`지금 크기 가로 ${X} × 세로 ${Z} × 높이 ${Y}cm`}));
  const gb=el('button',{class:'pbtn',style:'margin-top:10px',text:glass?'유리 벽 걷어내서 정원으로':'유리 벽 둘러서 수조로'});
  gb.onclick=()=>{ glass=!glass; if(!glass) wlOver=Math.min(Y-3,wl+2); drops=[]; setupView(view); dirty=true; const tt=cur(); if(tt){ tt.garden=!glass; saveIndexLocal(); } toast(glass?'유리 벽을 둘렀어요':'유리 벽을 걷어냈어요'); renderSheet(); };
  panel.appendChild(gb);
  panel.appendChild(el('h3',{text:'크기'}));
  const pr=el('div',{class:'row'}); for(const [nm,px,py,pz] of PRESETS) pr.appendChild(el('button',{class:'pbtn',text:nm,on:{click:()=>{ draft={X:px,Y:py,Z:pz}; renderSheet(); }}})); panel.appendChild(pr);
  const dims=[['가로','X',MINS,MAXX,4],['세로','Z',MINS,MAXZ,4],['높이','Y',MINS,MAXY,2]];
  const info=el('div',{class:'small',style:'margin:6px 0 10px'});
  const upd=()=>{ const n=draft.X*draft.Y*draft.Z; info.textContent=`${Math.round(n/10000)}만 칸, 기기 부담 ${load(n)}`; };
  for(const [lb,key,mn,mx,st] of dims){ const out=el('output',{text:`${draft[key]}cm`});
    const r=el('input',{type:'range',min:mn,max:mx,step:st,value:draft[key],'aria-label':lb});
    r.addEventListener('input',()=>{ draft[key]=+r.value; out.textContent=`${draft[key]}cm`; upd(); });
    panel.appendChild(el('div',{class:'dim'},el('span',{text:lb}),r,out)); }
  upd(); panel.appendChild(info);
  const same=draft.X===X&&draft.Y===Y&&draft.Z===Z, shrink=draft.X<X||draft.Y<Y||draft.Z<Z;
  const rb=el('button',{class:'pbtn main'+(sheetArm==='resize'?' armed':''),text:sheetArm==='resize'?'한 번 더 누르면 잘라요':'지금 크기 바꾸기'});
  if(same) rb.disabled=true;
  rb.onclick=()=>{ const go=()=>{ resizeTank(draft.X,draft.Y,draft.Z); setupView(view); refreshUi(); saveCurrent(true); toast(`가로 ${X} × 세로 ${Z} × 높이 ${Y}cm로 바꿨어요`); renderSheet(); };
    if(shrink) armSheet('resize','줄어드는 쪽은 잘려요. 한 번 더 누르면 바꿔요',go); else go(); };
  const nb=el('button',{class:'pbtn',text:'이 크기로 새 수조'});
  nb.onclick=async()=>{ if(index.length>=30) return toast('수조는 30개까지 저장할 수 있어요'); await createTank(draft.X,draft.Y,draft.Z,`수조 ${index.length+1}`); toast('새 수조를 만들었어요'); renderSheet(); };
  const gn=el('button',{class:'pbtn',text:'이 크기로 새 정원'});
  gn.onclick=async()=>{ if(index.length>=30) return toast('30개까지 저장할 수 있어요'); await createTank(draft.X,draft.Y,draft.Z,`정원 ${index.filter(t=>t.garden).length+1}`,true); toast('새 정원을 만들었어요'); renderSheet(); };
  panel.appendChild(el('div',{class:'row'},rb,nb,gn));
  panel.appendChild(el('div',{class:'small',style:'margin-top:8px',text:'늘릴 때는 가장자리 지형이 바깥으로 이어져요. 최대 240 × 240 × 80cm'}));
  panel.appendChild(el('h3',{text:'저장된 수조와 정원'}));
  const db2=el('button',{class:'pbtn',text:'복제해서 따로 저장'}); db2.onclick=async()=>{ if(index.length>=30) return toast('수조는 30개까지 저장할 수 있어요'); await duplicateTank(); toast('사본을 만들고 사본으로 옮겼어요'); renderSheet(); };
  panel.appendChild(el('div',{class:'row',style:'margin-bottom:6px'},db2));
  const list=[...index].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  for(const q of list){ const isCur=q.id===currentId;
    const nm=el('div',{class:'nm'},el('div',{text:q.name+(isCur?'  (지금 보는 곳)':'')}),el('div',{class:'small',text:`${q.garden?'정원':'수조'}   ${q.X} × ${q.Z} × ${q.Y}cm   ${fmtDate(q.updatedAt)}`}));
    const row=el('div',{class:'tank'},nm);
    if(!isCur){ row.appendChild(el('button',{class:'pbtn',text:'열기',on:{click:async()=>{ await switchTo(q.id); draft=null; renderSheet(); }}}));
      const del=el('button',{class:'pbtn'+(sheetArm==='del'+q.id?' armed':''),text:sheetArm==='del'+q.id?'정말 삭제':'삭제'});
      del.onclick=()=>armSheet('del'+q.id,'한 번 더 누르면 삭제해요',async()=>{ await deleteTank(q.id); toast('삭제했어요'); renderSheet(); }); row.appendChild(del); }
    panel.appendChild(row); }
  panel.appendChild(el('h3',{text:'백업'}));
  panel.appendChild(el('div',{class:'row'},el('button',{class:'pbtn',text:'모두 내보내기',on:{click:exportAll}}),el('button',{class:'pbtn',text:'백업 불러오기',on:{click:importBackup}})));
  panel.appendChild(el('div',{class:'small',style:'margin-top:6px',text:'수조와 정원 전부를 파일 하나로 저장해요. 불러오면 목록에 새로 추가돼요'}));
  panel.appendChild(el('div',{class:'small',style:'margin-top:10px',text:dbApi?'이 기기와 계정에 함께 저장돼요':'이 기기에 저장돼요'})); }
function openSheet(){ draft={X,Y,Z}; sheetArm=null; renderSheet(); sheet.hidden=false; }
function closeSheet(){ sheet.hidden=true; }
document.getElementById('tankBtn').onclick=openSheet;
sheet.addEventListener('click',e=>{ if(e.target===sheet) closeSheet(); });

// ================= pointer =================
const ptrs=new Map(); let pinch=null, panDrag=null, ptr=null, tapStart=null;
function toPx(cx,cy){ const r=cv.getBoundingClientRect(); return {x:Math.floor((cx-r.left)/r.width*CW), y:Math.floor((cy-r.top)/r.height*CH)}; }
const ISO_CYCLE=['fr','br','bl','fl'];
const holdTools=new Set(['soil','sand','grav','grass','erase','waterUp','waterDown','wall','fence','fert']);
function stagePt(e){ const r=stage.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  ptrs.set(e.pointerId,stagePt(e));
  if(ptrs.size===2){ ptr=null; tapStart=null; panDrag=null; const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,m:[(a[0]+b[0])/2,(a[1]+b[1])/2],z:zoom,px:panX,py:panY}; return; }
  if(ptrs.size>2) return;
  tapStart={cx:e.clientX,cy:e.clientY,t:performance.now()};
  const widget=document.body.classList.contains('widget');
  if(widget||tool==='pan'||e.button===1||e.button===2){ panDrag={s:stagePt(e),px:panX,py:panY}; return; }
  if(holdTools.has(tool)){ const p=toPx(e.clientX,e.clientY); ptr={x:p.x,y:p.y}; cardEl.hidden=true; strokeSet.clear(); lastStroke=null; overWarned=false; } });
cv.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,stagePt(e));
  if(pinch&&ptrs.size>=2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1])||1, m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const f=fitZoom(), nz=clamp(pinch.z*d/pinch.d,f*0.6,Math.max(16,f*2)); const wx=(pinch.m[0]-pinch.px)/pinch.z, wy=(pinch.m[1]-pinch.py)/pinch.z;
    zoom=nz; panX=m[0]-wx*zoom; panY=m[1]-wy*zoom; fitMode=false; applyT(); return; }
  if(panDrag){ const s=stagePt(e); const dx=s[0]-panDrag.s[0], dy=s[1]-panDrag.s[1]; if(Math.abs(dx)+Math.abs(dy)>4){ panX=panDrag.px+dx; panY=panDrag.py+dy; fitMode=false; applyT(); } return; }
  if(ptr){ const p=toPx(e.clientX,e.clientY); ptr.x=p.x; ptr.y=p.y; } });
function endPointer(e){ ptrs.delete(e.pointerId);
  if(pinch){ if(ptrs.size<2) pinch=null; tapStart=null; if(ptrs.size===0) panDrag=null; ptr=null; return; }
  const ts=tapStart; tapStart=null; ptr=null;
  const wasPan=panDrag; panDrag=null;
  if(!ts||e.type==='pointercancel') return;
  const moved=Math.hypot(e.clientX-ts.cx,e.clientY-ts.cy), dur=performance.now()-ts.t;
  if(moved>10||dur>700) return;
  if(document.body.classList.contains('widget')){ const i=ISO_CYCLE.indexOf(view); setupView(ISO_CYCLE[(i+1)%4]); buildCube(); return; }
  if(wasPan&&tool!=='pan') return;
  if(MATID[tool]&&dur<260){ const p=toPx(e.clientX,e.clientY), k=pick(p.x,p.y); if(k>=0) throwLump(kx(k),kz(k),MATID[tool]); return; }
  if(tool==='pan'||holdTools.has(tool)) return;
  const p=toPx(e.clientX,e.clientY), k=pick(p.x,p.y), kind=kindOf(tool);
  if(kind==='look') return inspect(k);
  cardEl.hidden=true; if(k<0) return; const x=kx(k), z=kz(k);
  if(kind==='plant') placePlant(tool,x,z); else if(kind==='animal') placeAnimal(tool,x,z); else if(tool==='rock') stampRock(x,z); else if(tool==='wood') stampWood(x,z); else if(tool==='step') stampStep(x,z); else if(tool==='lantern') stampLantern(x,z); }
cv.addEventListener('pointerup',endPointer); cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('contextmenu',e=>e.preventDefault());
function holdTool(dt){ if(!ptr) return;
  if(tool==='waterUp'){ wl=Math.min(Y-3,wl+dt*2.5); dirty=true; plantsDirty=true; return; }
  if(tool==='waterDown'){ wl=Math.max(0,wl-dt*2.5); dirty=true; plantsDirty=true; return; }
  const k=pick(ptr.x,ptr.y); if(k<0) return; const x=kx(k), z=kz(k);
  if(tool==='fert') return fertilize(x,z,dt);
  if(tool==='wall'||tool==='fence'){ const from=lastStroke||[x,z], n=Math.max(Math.abs(x-from[0]),Math.abs(z-from[1]),1);
    for(let i=0;i<=n;i++){ const cx=Math.round(from[0]+(x-from[0])*i/n), cz=Math.round(from[1]+(z-from[1])*i/n), key=cz*X+cx; if(strokeSet.has(key)) continue; strokeSet.add(key); tool==='wall'?buildWall(cx,cz):buildFence(cx,cz); }
    lastStroke=[x,z]; return; }
  if(tool==='erase') dig(x,z); else if(MATID[tool]) pour(x,z,MATID[tool]); }

// ================= loop =================
const clockEl=document.getElementById('clock'), subEl=document.getElementById('sub');
let last=performance.now(), physAcc=0, simAcc=0, lastRender=0, lastLabel=0;
function label(){ const d=simDate(), h=d.getHours(), m=d.getMinutes(), t=`${h<12?'오전':'오후'} ${h%12||12}:${String(m).padStart(2,'0')}`;
  clockEl.textContent=summer?`한여름 ${t}`:`${d.getMonth()+1}월 ${d.getDate()}일 ${t}`;
  const tk=cur(); subEl.textContent=`${tk?tk.name+'   ':''}${glass?'':WX_NAME[weather.type]+'   '}수위 ${WLi()}cm   ${VIEWS[view]}`; }
function frame(now){ const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(speed===1&&Date.now()-lastSimReal>60000){ welcomeBack(catchUp(lastSimReal)); }
  if(speed===1) simTime=Date.now(); else simTime+=dt*speed*1000;
  physAcc+=dt; if(physAcc>=1/30){ physAcc=0; physics(); }
  holdTool(dt);
  if(parts.length){ for(const q of parts){ q.y-=dt*12; q.t+=dt; } parts=parts.filter(q=>q.t<0.7&&q.y>hAt(q.x,q.z)); }
  const L=lightAtDate(simDate());
  updateAnimals(dt,L);
  for(const p of plants){ if(!SP[p.t].float) continue; p.vx=(p.vx||0)*0.97+(Math.random()-0.5)*0.03; p.vz=(p.vz||0)*0.97+(Math.random()-0.5)*0.03;
    const nx=clamp(p.x+p.vx*dt,0.5,X-1.5), nz=clamp(p.z+p.vz*dt,0.5,Z-1.5); if(WLi()-hAt(nx,nz)>=SP[p.t].minDepth){ p.x=nx; p.z=nz; } else { p.vx=-p.vx; p.vz=-p.vz; } }
  simAcc+=dt; if(simAcc>=0.5){ const d=simAcc; simAcc=0; simStep(d*speed); lastSimReal=Date.now(); dirty=true; }
  const ri=clamp(40+N/40000,66,220);
  if(now-lastRender>=ri){ lastRender=now; render(now); }
  if(now-lastLabel>500){ lastLabel=now; label(); }
  const t=Date.now(), localEvery=N>2e6?60000:20000;
  if(dirty&&!saving&&t-lastLocal>localEvery){ dirty=false; saveCurrent(); }
  if(cloudDirty&&dbApi&&t-lastCloud>180000) cloudSave();
  requestAnimationFrame(frame); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ saveCurrent(true).then(cloudSave); } else last=performance.now(); });

// ================= boot =================
let freshStart=false;
allocWorld(56,44,36);
(async()=>{
  index=lsGet(IKEY,[]); currentId=lsGet(CKEY,null); deleted=lsGet(DKEY,[]);
  let ok=false;
  if(index.length){ if(!index.find(t=>t.id===currentId)) currentId=index[0].id; ok=await loadTank(currentId); }
  if(!ok&&!index.length){ const v1=lsGet('korean-aquatic-tank-v1',null);
    if(v1&&v1.v===1){ try{ applyV1(v1); ok=true; }catch(e){} }
    const id=newId(); if(!ok){ starter(); freshStart=true; } index.push({id,name:'수조 1',X,Y,Z,updatedAt:Date.now()}); currentId=id; saveIndexLocal(); ok=true; }
  if(!ok){ starter(); }
  setupView(view); refreshUi(); render(performance.now());
  requestAnimationFrame(frame);
  saveCurrent(true);
  initDb();
})();
})();
</script>
